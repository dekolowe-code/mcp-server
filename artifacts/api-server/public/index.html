const { createElement: h, useState, useEffect, useRef, useCallback } = React;

// ─── Utils ───────────────────────────────────────────────────────────────────

const BASE = '/api/ui';

async function api(path, opts = {}) {
  const r = await fetch(BASE + path, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(err.error || r.statusText);
  }
  return r.json();
}

function post(path, body) {
  return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

// ─── Dashboard ───────────────────────────────────────────────────────────────

// ─── Workspace ───────────────────────────────────────────────────────────────

function Workspace() {
  const [currentPath, setCurrentPath] = useState('.');
  const [items, setItems] = useState([]);
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileContent, setFileContent] = useState('');
  const [tree, setTree] = useState('');
  const [view, setView] = useState('browser'); // browser | tree | file
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [editing, setEditing] = useState(false);
  const [editContent, setEditContent] = useState('');
  const [saving, setSaving] = useState(false);
  const [copied, setCopied] = useState(false);

  const loadDir = useCallback(async (p) => {
    setLoading(true); setError('');
    try {
      const data = await api(`/workspace/list?path=${encodeURIComponent(p)}`);
      const sorted = [...data.items].sort((a, b) => {
        if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      setItems(sorted);
      setCurrentPath(p);
      setSelectedFile(null);
      setFileContent('');
      setView('browser');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  const loadTree = useCallback(async () => {
    setLoading(true); setError('');
    try {
      const data = await api(`/workspace/tree?path=.&depth=4`);
      setTree(data.tree);
      setView('tree');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  const loadFile = useCallback(async (p) => {
    setLoading(true); setError('');
    try {
      const data = await api(`/workspace/file?path=${encodeURIComponent(p)}`);
      setFileContent(data.content);
      setSelectedFile(p);
      setEditContent(data.content);
      setEditing(false);
      setView('file');
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  const saveFile = async () => {
    setSaving(true);
    try {
      await post('/workspace/write', { path: selectedFile, content: editContent });
      setFileContent(editContent);
      setEditing(false);
    } catch (e) { setError(e.message); }
    finally { setSaving(false); }
  };

  const copyContent = () => {
    navigator.clipboard.writeText(fileContent);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  useEffect(() => { loadDir('.'); }, [loadDir]);

  const breadcrumbs = currentPath === '.' ? ['workspace'] : ['workspace', ...currentPath.split('/').filter(Boolean)];

  const getExt = (name) => name.split('.').pop()?.toLowerCase() || '';
  const getLanguage = (name) => {
    const ext = getExt(name);
    const map = { ts: 'typescript', tsx: 'typescript', js: 'javascript', jsx: 'javascript', py: 'python', json: 'json', md: 'markdown', css: 'css', html: 'html', yaml: 'yaml', yml: 'yaml', sh: 'bash', prisma: 'prisma', go: 'go', rs: 'rust' };
    return map[ext] || 'text';
  };

  const navigateUp = () => {
    if (currentPath === '.') return;
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    loadDir(parts.length === 0 ? '.' : parts.join('/'));
  };

  return h('div', { className: 'flex h-full' },
    // Sidebar
    h('div', { className: 'w-64 border-r border-slate-700 flex flex-col flex-shrink-0' },
      h('div', { className: 'p-3 border-b border-slate-700 flex items-center gap-2' },
        h('button', { onClick: () => loadDir('.'), className: 'btn text-xs text-slate-400 hover:text-white', title: 'Root' }, h(Icon, { name: 'folder', size: 14 })),
        h('button', { onClick: navigateUp, className: 'btn text-xs text-slate-400 hover:text-white px-2 py-1 rounded', title: 'Up' }, '..'),
        h('button', { onClick: loadTree, className: 'btn text-xs text-slate-400 hover:text-white px-2 py-1 rounded' }, 'Tree'),
        loading && h('div', { className: 'spinner ml-auto' }),
      ),
      // Breadcrumb
      h('div', { className: 'px-3 py-2 text-xs text-slate-500 flex items-center gap-1 flex-wrap border-b border-slate-700' },
        breadcrumbs.map((b, i) => h('span', { key: i, className: 'flex items-center gap-1' },
          i > 0 && h('span', { className: 'text-slate-600' }, '/'),
          h('span', { className: 'text-slate-300' }, b),
        ))
      ),
      h('div', { className: 'flex-1 overflow-y-auto p-2 space-y-0.5' },
        error && h('div', { className: 'text-red-400 text-xs p-2' }, error),
        view === 'tree'
          ? h('pre', { className: 'text-xs text-slate-300 terminal-line p-2' }, tree)
          : items.map(item =>
            h('div', {
              key: item.name,
              className: `file-item ${selectedFile === (currentPath === '.' ? item.name : currentPath + '/' + item.name) ? 'selected' : ''}`,
              onClick: () => {
                const fullPath = currentPath === '.' ? item.name : currentPath + '/' + item.name;
                if (item.type === 'dir') loadDir(fullPath);
                else loadFile(fullPath);
              }
            },
              h('span', { className: item.type === 'dir' ? 'text-sky-400' : 'text-slate-400' },
                h(Icon, { name: item.type === 'dir' ? 'folder' : 'file', size: 13 })
              ),
              h('span', { className: 'truncate flex-1' }, item.name),
              item.type === 'dir' && h('span', { className: 'text-slate-600 text-xs' }, '/'),
            )
          )
      ),
    ),

    // Content pane
    h('div', { className: 'flex-1 flex flex-col min-w-0' },
      view === 'file' && selectedFile
        ? h('div', { className: 'flex flex-col h-full' },
          h('div', { className: 'flex items-center justify-between px-4 py-2 border-b border-slate-700 bg-slate-800/50 flex-shrink-0' },
            h('div', { className: 'text-sm text-slate-300 font-mono truncate' }, selectedFile),
            h('div', { className: 'flex items-center gap-2 flex-shrink-0' },
              h('span', { className: 'badge bg-slate-700 text-slate-300' }, getLanguage(selectedFile.split('/').pop() || '')),
              h('button', { onClick: copyContent, className: 'btn text-xs text-slate-400 hover:text-white flex items-center gap-1 px-2 py-1 rounded bg-slate-700' },
                copied ? h(Icon, { name: 'check', size: 12 }) : h(Icon, { name: 'copy', size: 12 }),
                copied ? 'Copied' : 'Copy',
              ),
              h('button', { onClick: () => setEditing(!editing), className: `btn text-xs px-2 py-1 rounded ${editing ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-300 hover:text-white'}` }, editing ? 'Cancel' : 'Edit'),
              editing && h('button', { onClick: saveFile, className: 'btn text-xs px-2 py-1 rounded bg-sky-500 text-white flex items-center gap-1' },
                saving ? h('div', { className: 'spinner' }) : h(Icon, { name: 'check', size: 12 }),
                'Save'
              ),
            ),
          ),
          editing
            ? h('textarea', {
                value: editContent,
                onChange: e => setEditContent(e.target.value),
                className: 'flex-1 p-4 bg-slate-900 text-slate-200 font-mono text-xs resize-none outline-none terminal-line',
                spellCheck: false,
              })
            : h('pre', { className: 'flex-1 overflow-auto p-4 text-xs text-slate-300 terminal-line' }, fileContent),
        )
        : h('div', { className: 'flex-1 flex items-center justify-center text-slate-600' },
          h('div', { className: 'text-center' },
            h(Icon, { name: 'file', size: 40 }),
            h('p', { className: 'mt-2 text-sm' }, 'Select a file to view'),
          )
        )
    ),
  );
}

    ]

    ]

  { id: 'generate_code', label: 'Custom Code', icon: '🔧', color: 'from-orange-700 to-red-700',
    fields: [
      { key: 'description', label: 'What to generate', type: 'textarea', placeholder: 'A TypeScript function that...' },
      { key: 'language', label: 'Language', type: 'text', placeholder: 'TypeScript' },
      { key: 'framework', label: 'Framework (optional)', type: 'text', placeholder: 'React, Express, etc.' },
      { key: 'project_name', label: 'Output directory (optional)', type: 'text', placeholder: 'my-code' },
    ]
  },
];

function Generator() {
  const [selected, setSelected] = useState(null);
  const [params, setParams] = useState({});
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');

  const selectTool = (tool) => {
    setSelected(tool);
    const defaults = {};
    tool.fields.forEach(f => {
      if (f.type === 'select') defaults[f.key] = f.options[0];
    });
    setParams(defaults);
    setResult(null);
    setError('');
  };

  const run = async () => {
    if (!selected) return;
    const missing = selected.fields.filter(f => f.type !== 'select' && !params[f.key] && !f.optional && f.key !== 'features' && f.key !== 'framework' && f.key !== 'sections');
    if (missing.length) { setError(`Missing: ${missing.map(f => f.label).join(', ')}`); return; }

    const cleanParams = { ...params };
    if (cleanParams.features && typeof cleanParams.features === 'string') {
      cleanParams.features = cleanParams.features.split(',').map(s => s.trim()).filter(Boolean);
    }

    setLoading(true); setError(''); setResult(null);
    try {
      const data = await post('/generate', { tool: selected.id, params: cleanParams });
      setResult(data);
    } catch (e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return h('div', { className: 'p-6 space-y-6 fade-in' },
    h('div', null,
      h('h2', { className: 'text-xl font-bold text-white' }, '⚡ Code Generator'),
      h('p', { className: 'text-slate-400 text-sm mt-1' }, 'Générez des applications complètes avec Mistral AI'),
    ),

    // Tool grid
    !selected && h('div', { className: 'grid grid-cols-2 gap-3' },
      TOOLS.map(tool =>
        h('button', {
          key: tool.id,
          onClick: () => selectTool(tool),
          className: `btn card p-5 text-left hover:border-sky-500 transition-all`,
        },
          h('div', { className: `bg-gradient-to-br ${tool.color} rounded-lg w-10 h-10 flex items-center justify-center text-xl mb-3` }, tool.icon),
          h('div', { className: 'font-semibold text-white text-sm' }, tool.label),
          h('div', { className: 'text-slate-400 text-xs mt-1' }, 'Click to configure'),
        )
      )
    ),

    // Form
    selected && !result && h('div', { className: 'space-y-4 fade-in' },
      h('div', { className: 'flex items-center gap-3' },
        h('button', { onClick: () => setSelected(null), className: 'btn text-slate-400 hover:text-white' },
          h(Icon, { name: 'x', size: 16 })
        ),
        h('div', { className: `bg-gradient-to-br ${selected.color} rounded-lg w-8 h-8 flex items-center justify-center text-lg` }, selected.icon),
        h('h3', { className: 'font-bold text-white' }, selected.label),
      ),
      h('div', { className: 'card p-5 space-y-4' },
        selected.fields.map(field =>
          h('div', { key: field.key },
            h('label', { className: 'block text-xs font-medium text-slate-400 mb-1.5' }, field.label),
            field.type === 'textarea'
              ? h('textarea', { rows: 3, placeholder: field.placeholder, value: params[field.key] || '', onChange: e => setParams(p => ({ ...p, [field.key]: e.target.value })), className: 'input resize-none' })
              : field.type === 'select'
              ? h('select', { value: params[field.key] || field.options[0], onChange: e => setParams(p => ({ ...p, [field.key]: e.target.value })), className: 'input' },
                  field.options.map(o => h('option', { key: o, value: o }, o))
                )
              : h('input', { type: 'text', placeholder: field.placeholder, value: params[field.key] || '', onChange: e => setParams(p => ({ ...p, [field.key]: e.target.value })), className: 'input' }),
          )
        ),
        error && h('div', { className: 'text-red-400 text-sm bg-red-500/10 rounded-lg p-3 border border-red-500/20' }, '⚠️ ' + error),
        h('button', {
          onClick: run,
          disabled: loading,
          className: 'btn w-full py-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-semibold flex items-center justify-center gap-2',
        },
          loading ? h('div', { className: 'spinner' }) : h(Icon, { name: 'zap', size: 16 }),
          loading ? 'Génération en cours...' : '🚀 Générer',
        ),
      ),
    ),

    // Result
    selected && result && h('div', { className: 'space-y-4 fade-in' },
      h('div', { className: 'flex items-center gap-3' },
        h('button', { onClick: () => { setResult(null); }, className: 'btn text-slate-400 hover:text-white' },
          h(Icon, { name: 'arrow', size: 16 })
        ),
        h('h3', { className: 'font-bold text-white' }, 'Résultat'),
      ),
      h('div', { className: 'card p-4 border-green-500/30 bg-green-500/5' },
        h('div', { className: 'flex items-center gap-2 text-green-400 font-semibold text-sm mb-3' },
          h(Icon, { name: 'check', size: 16 }), '✅ Génération terminée'
        ),
        result.writtenFiles && result.writtenFiles.length > 0 && h('div', null,
          h('div', { className: 'text-xs text-slate-400 mb-2' }, `${result.writtenFiles.length} fichiers créés dans le workspace:`),
          h('div', { className: 'space-y-1 max-h-40 overflow-y-auto' },
            result.writtenFiles.map((f, i) =>
              h('div', { key: i, className: 'text-xs font-mono text-slate-300 flex items-center gap-2' },
                h('span', { className: 'text-green-500' }, '→'),
                f
              )
            )
          )
        ),
      ),
      h('div', { className: 'card' },
        h('div', { className: 'flex items-center justify-between p-3 border-b border-slate-700' },
          h('span', { className: 'text-xs text-slate-400' }, 'Generated content'),
          h('button', {
            onClick: () => { navigator.clipboard.writeText(result.text); },
            className: 'btn text-xs text-slate-400 hover:text-white flex items-center gap-1'
          }, h(Icon, { name: 'copy', size: 12 }), 'Copy'),
        ),
        h('pre', { className: 'p-4 text-xs text-slate-300 overflow-auto max-h-96 terminal-line' }, result.text),
      ),
      h('div', { className: 'flex gap-3' },
        h('button', { onClick: () => { setResult(null); }, className: 'btn flex-1 py-2 card rounded-xl text-slate-300 hover:text-white text-sm font-medium' }, '← Nouveau projet'),
        h('button', { onClick: () => { setSelected(null); setResult(null); }, className: 'btn flex-1 py-2 bg-sky-500 rounded-xl text-white text-sm font-semibold' }, 'Autre outil'),
      ),
    ),
  );
}

// ─── Terminal ─────────────────────────────────────────────────────────────────

function Terminal() {
  const [command, setCommand] = useState('');
  const [cwd, setCwd] = useState('');
  const [output, setOutput] = useState([]);
  const [loading, setLoading] = useState(false);
  const outputRef = useRef(null);
  const inputRef = useRef(null);

  const quickCmds = ['ls -la', 'pwd', 'ls workspace/', 'node --version', 'python3 --version', 'git status', 'cat package.json'];

  const run = async (cmd) => {
    const c = cmd || command;
    if (!c.trim()) return;
    const entry = { id: Date.now(), cmd: c, cwd: cwd || '.', running: true };
    setOutput(o => [...o, entry]);
    setCommand('');
    setLoading(true);
    try {
      const data = await post('/terminal/run', { command: c, cwd: cwd || undefined });
      setOutput(o => o.map(e => e.id === entry.id
        ? { ...e, running: false, stdout: data.stdout, stderr: data.stderr, exitCode: data.exitCode }
        : e
      ));
    } catch (err) {
      setOutput(o => o.map(e => e.id === entry.id
        ? { ...e, running: false, stderr: err.message, exitCode: 1 }
        : e
      ));
    } finally {
      setLoading(false);
      setTimeout(() => outputRef.current?.scrollTo({ top: outputRef.current.scrollHeight, behavior: 'smooth' }), 100);
    }
  };

  const onKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } };

  return h('div', { className: 'flex flex-col h-full' },
    // Quick commands
    h('div', { className: 'p-3 border-b border-slate-700 flex items-center gap-2 overflow-x-auto flex-shrink-0' },
      h('span', { className: 'text-slate-500 text-xs flex-shrink-0' }, 'Quick:'),
      ...quickCmds.map(cmd =>
        h('button', {
          key: cmd, onClick: () => run(cmd),
          className: 'btn flex-shrink-0 text-xs px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md font-mono',
        }, cmd)
      ),
    ),

    // Output
    h('div', { ref: outputRef, className: 'flex-1 overflow-y-auto p-4 space-y-4 font-mono' },
      output.length === 0 && h('div', { className: 'text-slate-600 text-sm text-center mt-10' },
        h('div', { className: 'text-3xl mb-2' }, '💻'),
        h('p', null, 'Terminal workspace'),
        h('p', { className: 'text-xs mt-1' }, 'Commandes exécutées dans /tmp/mcp-workspace'),
      ),
      output.map(entry =>
        h('div', { key: entry.id, className: 'space-y-1 fade-in' },
          h('div', { className: 'flex items-center gap-2' },
            h('span', { className: 'text-sky-400 text-xs' }, `[${entry.cwd}]`),
            h('span', { className: 'text-green-400 text-xs' }, '$'),
            h('span', { className: 'text-white text-xs' }, entry.cmd),
            entry.running && h('div', { className: 'spinner ml-2' }),
          ),
          !entry.running && entry.stdout && h('pre', { className: 'text-slate-300 text-xs pl-4 terminal-line' }, entry.stdout),
          !entry.running && entry.stderr && h('pre', { className: 'text-red-400 text-xs pl-4 terminal-line' }, entry.stderr),
          !entry.running && h('div', { className: `text-xs pl-4 ${entry.exitCode === 0 ? 'text-green-500' : 'text-red-500'}` },
            entry.exitCode === 0 ? '✓ Exit 0' : `✗ Exit ${entry.exitCode}`
          ),
        )
      ),
    ),

    // Input
    h('div', { className: 'border-t border-slate-700 p-3 flex-shrink-0' },
      h('div', { className: 'flex items-center gap-2 mb-2' },
        h('span', { className: 'text-slate-500 text-xs' }, 'cwd:'),
        h('input', { type: 'text', placeholder: '. (workspace root)', value: cwd, onChange: e => setCwd(e.target.value), className: 'input text-xs flex-1', style: { padding: '4px 8px' } }),
        h('button', { onClick: () => setOutput([]), className: 'btn text-xs text-slate-500 hover:text-white px-2' }, 'Clear'),
      ),
      h('div', { className: 'flex items-center gap-2' },
        h('span', { className: 'text-green-400 font-mono text-sm' }, '$'),
        h('input', {
          ref: inputRef, type: 'text', placeholder: 'Tapez une commande... (Entrée pour exécuter)',
          value: command, onChange: e => setCommand(e.target.value), onKeyDown: onKey,
          className: 'input flex-1', style: { fontFamily: 'monospace', fontSize: '13px' },
        }),
        h('button', {
          onClick: () => run(), disabled: loading || !command.trim(),
          className: 'btn px-4 py-2 bg-sky-500 hover:bg-sky-400 text-white rounded-lg text-sm font-medium flex items-center gap-1.5 disabled:opacity-50',
        }, loading ? h('div', { className: 'spinner' }) : h(Icon, { name: 'play', size: 14 }), 'Run'),
      ),
    ),
  );
}

// ─── App Shell ────────────────────────────────────────────────────────────────

const TABS = [
  { id: 'dashboard', label: 'Dashboard', icon: 'dashboard' },
  { id: 'workspace', label: 'Workspace', icon: 'folder' },
  { id: 'generate', label: 'Générer', icon: 'zap' },
  { id: 'terminal', label: 'Terminal', icon: 'terminal' },
];

function App() {
  const [activeTab, setActiveTab] = useState('dashboard');

  const content = {
    dashboard: h(Dashboard),
    workspace: h(Workspace),
    generate: h(Generator),
    terminal: h(Terminal),
  };

  return h('div', { className: 'flex h-screen overflow-hidden' },
    // Sidebar nav
    h('nav', { className: 'w-56 bg-slate-900 border-r border-slate-700 flex flex-col flex-shrink-0' },
      h('div', { className: 'p-4 border-b border-slate-700' },
        h('div', { className: 'flex items-center gap-2' },
          h('div', { className: 'w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center text-sm' }, '🤖'),
          h('div', null,
            h('div', { className: 'font-bold text-white text-sm' }, 'MCP Builder'),
            h('div', { className: 'text-slate-500 text-xs' }, 'v1.0.0'),
          ),
        ),
      ),
      h('div', { className: 'flex-1 p-3 space-y-1' },
        TABS.map(tab =>
          h('button', {
            key: tab.id,
            onClick: () => setActiveTab(tab.id),
            className: `tab w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-left ${activeTab === tab.id ? 'tab-active' : 'text-slate-400'}`,
          },
            h(Icon, { name: tab.icon, size: 16 }),
            tab.label,
          )
        ),
      ),
      h('div', { className: 'p-4 border-t border-slate-700' },
        h('a', { href: '/api/mcp/info', target: '_blank', className: 'btn flex items-center gap-2 text-xs text-slate-500 hover:text-white' },
          h(Icon, { name: 'info', size: 12 }),
          'MCP API Info',
        ),
      ),
    ),

    // Main content
    h('main', { className: 'flex-1 overflow-y-auto bg-slate-800 min-w-0' },
      h('div', { className: `h-full ${activeTab === 'workspace' || activeTab === 'terminal' ? 'flex flex-col' : ''}` },
        content[activeTab]
      )
    ),
  );
}

createRoot(document.getElementById('app')).render(h(App));
</script>
</body>
</html>
